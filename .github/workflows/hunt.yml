
name: AUTOMATON Scheduled Opportunity Hunt

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out AUTOMATON
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hunt public job feeds
        run: python automaton_v0_5.py

      - name: Save scan report
        uses: actions/upload-artifact@v4
        with:
          name: automaton-opportunity-report
          path: output/
          retention-days: 7
          
